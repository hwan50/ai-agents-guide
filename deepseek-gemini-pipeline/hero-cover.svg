  <rect x="310" y="390" width="70" height="32" rx="4" fill="none" stroke="#211F1B" stroke-width="1.5"/>
  <text x="345" y="411" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#211F1B" text-anchor="middle" letter-spacing="0.08em">MCP</text>
  
